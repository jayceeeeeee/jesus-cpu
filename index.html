<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>Jesus CPU — Diagramme</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <a class="wordmark" href="./">JESUS CPU <span>/ 001</span></a>
    <span class="tag">Étude de structure</span>
  </header>
  <main>
    <section class="intro" aria-labelledby="title">
      <div><p class="eyebrow">LE DIAGRAMME</p><h1 id="title">Une structure, trois centres.</h1></div>
      <p class="description">Dessin vectoriel. Traits nets à toute échelle.<br>Export avec fond transparent.</p>
    </section>
    <section class="workspace" aria-label="Aperçu du diagramme">
      <div class="toolbar">
        <fieldset><legend class="sr-only">Fond de l’aperçu</legend><button type="button" class="view-button active" data-background="white" aria-pressed="true">Blanc</button><button type="button" class="view-button" data-background="checker" aria-pressed="false">Damier</button></fieldset>
        <span class="dimensions">800 × 800 · SVG</span>
      </div>
      <div class="preview" id="preview"><object id="diagram" data="diagram.svg" type="image/svg+xml" aria-label="Diagramme Jesus CPU"><img src="diagram.svg" alt="Diagramme Jesus CPU"></object></div>
      <div class="export-bar">
        <div class="export-note"><span class="status-dot"></span>Fond transparent dans tous les exports</div>
        <div class="actions"><label class="sr-only" for="size">Dimensions du PNG</label><select id="size"><option value="800">PNG · 800 px</option><option value="1600" selected>PNG · 1 600 px</option><option value="3200">PNG · 3 200 px</option></select><a class="button secondary" href="diagram.svg" download="jesus-cpu.svg">Télécharger SVG</a><button type="button" class="button primary" id="download-png">Télécharger PNG <span aria-hidden="true">↓</span></button></div>
      </div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <footer><span>JESUS CPU</span><span>Géométrie & connexions</span></footer>
  </main>
</body>
</html>
